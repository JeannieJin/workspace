<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카운터 앱</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white rounded-lg shadow-lg p-8 w-80">
        <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">카운터</h1>

        <!-- 카운트 표시 -->
        <div class="bg-blue-50 border-2 border-blue-200 rounded-lg p-6 mb-8">
            <p class="text-center text-gray-600 text-sm mb-2">현재 카운트</p>
            <p id="count" class="text-6xl font-bold text-center text-blue-600">0</p>
        </div>

        <!-- 버튼 그룹 -->
        <div class="space-y-3">
            <!-- 증가 버튼 -->
            <button
                onclick="increment()"
                class="w-full bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 text-lg"
            >
                +1 증가
            </button>

            <!-- 감소 버튼 -->
            <button
                onclick="decrement()"
                class="w-full bg-blue-400 hover:bg-blue-500 active:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg transition duration-200 text-lg"
            >
                -1 감소
            </button>

            <!-- 리셋 버튼 -->
            <button
                onclick="reset()"
                class="w-full bg-blue-300 hover:bg-blue-400 active:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200 text-lg"
            >
                리셋
            </button>
        </div>
    </div>

    <script>
        let count = 0;

        function increment() {
            count++;
            updateDisplay();
        }

        function decrement() {
            count--;
            updateDisplay();
        }

        function reset() {
            count = 0;
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById('count').textContent = count;
        }
    </script>
</body>
</html>
